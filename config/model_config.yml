# Pack-a-Punch Model Configuration
# This file centralizes all model-related parameters for easy customization.

model:
  # Model identifier (HuggingFace Hub)
  name: "answerdotai/ModernBERT-base"

  # Maximum sequence length in tokens
  max_length: 3072

  # Number of classification labels
  num_labels: 9

  # Label mapping (id -> name)
  label_map:
    0: "Autonomous Driving and UVs"
    1: "Enterprise AI"
    2: "Environmental AI"
    3: "Fintech and Marketing"
    4: "Generic use"
    5: "Healthcare AI"
    6: "Research"
    7: "Robotics and Industry"
    8: "Virtual assistants"

  # Model architecture (used for ONNX optimization)
  architecture:
    num_heads: 12
    hidden_size: 768
    model_type: "modernbert"

training:
  batch_size: 32
  learning_rate: 2.0e-5
  num_epochs: 4
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  save_steps: 500
  eval_steps: 100
  early_stopping_patience: 7
  # K-Fold Cross Validation
  kfold_enabled: true
  kfold_splits: 5

inference:
  batch_size: 256
  num_sessions: 2
  max_queue_size: 1000
  batch_timeout_ms: 50
  use_fp16: true
  device: "cuda"

server:
  host: "0.0.0.0"
  port: 8080
  max_batch_size: 256
  workers: 1
  timeout: 60

distillation:
  teacher_url: "http://localhost:1234/v1/chat/completions"
  teacher_model: "local-model"
  batch_size: 10
  confidence_threshold: 0.8
  max_samples: 10000
  system_prompt: |
    Sei un classificatore di testi. Devi determinare in quale settore di applicazione dell'intelligenza artificiale rientra il testo seguente.

    Le categorie possibili sono: "Autonomous Driving and UVs", "Enterprise AI", "Environmental AI", "Fintech and Marketing", "Generic use", "Healthcare AI", "Research", "Robotics and Industry", "Virtual assistants".

    Rispondi SOLO con un JSON nel formato: {"label": "<una delle categorie>", "confidence": 0.0-1.0}
