# Pack-a-Punch Docker Compose
# Orchestration for training and inference services

services:
  # Triton Inference Server - runs the ONNX model on GPU (dynamic batching + TensorRT)
  triton:
    # CUDA 13 build (required for Blackwell, e.g. RTX 5070 Ti / sm_120).
    # 26.01-py3 == CUDA 13.1.1, within the host driver's CUDA 13.2 ceiling.
    # CUDA-13 tags start at 25.08-py3; bump to a newer one only if the driver supports it
    # (26.06-py3 is CUDA 13.3 and needs a driver >= 13.3).
    image: nvcr.io/nvidia/tritonserver:26.01-py3
    container_name: pap-triton
    command: [ "tritonserver", "--model-repository=/models" ]
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC
      - "8002:8002" # metrics
    volumes:
      # Triton model repository (config.pbtxt + 1/model.onnx)
      - ../model_repository:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/v2/health/ready" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Inference gateway - tokenizes text and forwards tensors to Triton over gRPC
  classifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    image: pack-a-punch:serve
    container_name: pap-classifier
    ports:
      - "8080:8080"
    volumes:
      # Mount models directory (gateway needs the tokenizer files)
      - ../src/models:/app/src/models:ro
      # Mount config directory
      - ../config:/app/config:ro
      # Mount source for hot-reload
      - ../src/inference:/app/src/inference:ro
      - ../src/training:/app/src/training:ro
    environment:
      # Forward inference to the Triton container over gRPC
      - TRITON_URL=triton:8001
      # Max batch per Triton call; must match config.pbtxt max_batch_size (bounds GPU memory)
      - TRITON_MAX_BATCH=256
    depends_on:
      triton:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # Training service (on-demand)
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    image: pack-a-punch:train
    container_name: pap-trainer
    tty: true
    volumes:
      # Mount data directory (read-write)
      - ../src/data:/app/src/data:rw
      # Mount models directory (write output)
      - ../src/models:/app/src/models:rw
      # Mount config directory
      - ../config:/app/config:ro
      # Mount Test directory
      - ../../data/Test:/app/data/Test:ro
      # Mount traceability training data (train_traceability.csv + test_traceability.csv)
      - ../../../data/traceability/training:/app/data/traceability:ro
      # Mount source code for development (so changes apply without rebuild)
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
    command: [ "--data-source", "auto" ]
    environment:
      - PAP_TRAINING__FP16=true
      - TOKENIZERS_PARALLELISM=false
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - training # Only start with: docker-compose --profile training up

  # Distillation with LM Studio (requires network access)
  distiller:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    image: pack-a-punch:train
    container_name: pap-distiller
    volumes:
      - ../src/data:/app/src/data:rw
      - ../src/models:/app/src/models:rw
      - ../config:/app/config:ro
    environment:
      - PAP_DISTILLATION__TEACHER_URL=http://host.docker.internal:1234/v1/chat/completions
      - PAP_DISTILLATION__MAX_SAMPLES=10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [ "--data-source", "distillation" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - distillation # Only start with: docker-compose --profile distillation up

networks:
  default:
    name: pack-a-punch-network
